name: Daily X Giveaway Bot

on:
  schedule:
    # Runs daily at 2:00 PM UTC (10:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab for testing

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install tweepy requests

      - name: Run daily tweet script
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python .github/scripts/daily_tweet.py
